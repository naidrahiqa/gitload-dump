name: Dump OTA Payload

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "URL langsung ke file OTA (.zip berisi payload.bin)"
        required: true
        type: string
      partitions:
        description: "Partisi yang di-dump, pisah dengan koma (kosongkan = semua)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: dump-${{ inputs.ota_url }}
  cancel-in-progress: false

env:
  PDG_VERSION: "2.0.2"

jobs:
  dump:
    name: Dump & publish ke Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Kosongkan disk biar lega
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install payload-dumper-go
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
          curl -fsSL -o /tmp/pdg.tar.gz \
            "https://github.com/ssut/payload-dumper-go/releases/download/${PDG_VERSION}/payload-dumper-go_${PDG_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/pdg.tar.gz -C /tmp/
          sudo install -m 755 /tmp/payload-dumper-go /usr/local/bin/payload-dumper-go

      - name: Download OTA
        id: dl
        env:
          OTA_URL: ${{ inputs.ota_url }}
        run: |
          FILENAME="$(basename "${OTA_URL%%\?*}")"
          [[ "$FILENAME" == *.zip ]] || { echo "::error::URL harus mengarah ke file .zip"; exit 1; }

          DEVICE=""
          if [[ "$FILENAME" == *-ota-* ]]; then
            DEVICE="${FILENAME%%-ota-*}"
          elif [[ "$FILENAME" == miui_*Global_* ]]; then
            DEVICE="${FILENAME#miui_}"
            DEVICE="${DEVICE%%Global_*}"
          fi
          DEVICE="${DEVICE:-${FILENAME%.*}}"
          DEVICE="${DEVICE// /_}"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Detected device: $DEVICE"

          aria2c -x16 -s16 -k1M --file-allocation=none --console-log-level=warn \
            -o "$FILENAME" "$OTA_URL" \
            || { rm -f "$FILENAME"; curl -fL --retry 3 -o "$FILENAME" "$OTA_URL"; }
          ls -lh "$FILENAME"

      - name: Dump partisi
        env:
          FILENAME: ${{ steps.dl.outputs.filename }}
          PARTITIONS: ${{ inputs.partitions }}
        run: |
          args=(-o out)
          if [[ -n "${PARTITIONS// }" ]]; then
            args+=(-p "${PARTITIONS// /}")
          fi
          args+=("$FILENAME")
          payload-dumper-go "${args[@]}"
          ls -lh out/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILENAME: ${{ steps.dl.outputs.filename }}
          DEVICE: ${{ steps.dl.outputs.device }}
          PARTITIONS: ${{ inputs.partitions }}
          OTA_URL: ${{ inputs.ota_url }}
        run: |
          TAG="dump-${FILENAME%.*}"
          TAG="${TAG// /_}"
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          SKIPPED=""
          UPLOAD=""
          for f in out/*.img; do
            sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$sz" -gt 2147483648 ]; then
              SKIPPED="${SKIPPED}\n- ❌ $(basename "$f") — $(du -h "$f" | cut -f1) (melebihi limit 2GB GitHub Release)"
            else
              UPLOAD="$UPLOAD $f"
            fi
          done

          {
            echo "## ${DEVICE} — ${FILENAME}"
            echo
            echo "- **Device:** ${DEVICE}"
            echo "- **Sumber:** $OTA_URL"
            echo "- **Di-dump:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            if [[ -n "${PARTITIONS// }" ]]; then
              echo "- **Partisi:** ${PARTITIONS// /}"
            else
              echo "- **Partisi:** semua"
            fi
            echo
            echo "### File hasil dump"
            echo
            echo "| File | Ukuran |"
            echo "| ---- | ------ |"
            for f in out/*.img; do
              n="$(basename "$f")"
              s="$(du -h "$f" | cut -f1)"
              echo "| [$n](${BASE}/releases/download/${TAG}/${n}) | \`${s}\` |"
            done
            if [ -n "$SKIPPED" ]; then
              echo
              echo "### File yang tidak di-upload (melebihi 2GB)"
              echo -e "$SKIPPED"
            fi
            echo
            echo "> Dihasilkan otomatis lewat GitHub Actions."
          } > notes.md

          if [ -z "$UPLOAD" ]; then
            echo "::warning::Tidak ada file yang bisa di-upload (< 2GB)"
            gh release create "$TAG" --title "${DEVICE} — ${FILENAME}" --notes-file notes.md --latest
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $UPLOAD --clobber
          else
            gh release create "$TAG" $UPLOAD \
              --title "${DEVICE} — ${FILENAME}" \
              --notes-file notes.md \
              --latest
          fi
